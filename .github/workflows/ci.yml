name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with the test tools
        run: python -m pip install -e ".[test]"
      - name: Lint
        run: python -m ruff check .
      - name: Types (mypy --strict)
        run: python -m mypy
      - name: Types (pyright strict)
        run: python -m pyright
      - name: Tests (includes the documentation checks in all three languages)
        run: python -m pytest

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the wheel and the sdist
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean environment and import it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "import sukarisebot, pathlib; print(sukarisebot.__version__); assert (pathlib.Path(sukarisebot.__file__).parent / 'py.typed').exists()"
          /tmp/clean/bin/sukarisebot --help
